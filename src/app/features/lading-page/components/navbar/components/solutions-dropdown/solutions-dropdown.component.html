<div class="relative inline-flex" (mouseenter)="isOpen = true" (mouseleave)="isOpen = false">
  <!-- Trigger -->
  <button
    type="button"
    class="inline-flex h-9 items-center gap-1.5 rounded-full bg-rose-400 px-4 text-sm font-bold text-white shadow-sm transition hover:bg-rose-500"
    [class.bg-rose-500]="isOpen"
  >
    Cards

    <svg
      class="h-3.5 w-3.5 transition-transform duration-200"
      [class.rotate-180]="isOpen"
      viewBox="0 0 20 20"
      fill="currentColor"
    >
      <path
        fill-rule="evenodd"
        d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  <!-- Dropdown hover area -->
  <div *ngIf="isOpen" class="absolute left-0 top-full z-50 w-52 pt-2">
    <!-- Dropdown box -->
    <div
      class="overflow-hidden rounded-xl border border-rose-100 bg-white py-2 shadow-xl shadow-rose-100/80"
    >
      <a
        *ngFor="let item of items"
        [routerLink]="item.link"
        class="block px-4 py-2.5 text-sm font-semibold text-gray-700 transition hover:bg-rose-50 hover:text-rose-500"
      >
        {{ item.label }}
      </a>
    </div>
  </div>
</div>
